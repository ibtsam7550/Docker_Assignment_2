<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quadratic Solver</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
  <h1>Quadratic Equation Solver</h1>
  <p>Generate random a, b and c, where a is never zero.</p>
  <button id="solve" class="btn btn-primary">Generate and solve</button>
  <pre id="result" class="mt-3">Click the button to begin.</pre>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>
    $('#solve').on('click', function () {
      $.getJSON('/api/solve').done(function (d) {
        $('#result').text(`${d.a}x² + (${d.b})x + (${d.c}) = 0\n` +
          `${d.case}\nRoots: ${d.roots.length ? d.roots.join(', ') : 'None (real)'}\n` +
          `Discriminant: ${d.discriminant}\nHostname: ${d.hostname}\nIP: ${d.ip}\nUTC: ${d.timestamp}`);
      }).fail(function () { $('#result').text('Request failed. Check the containers.'); });
    });
  </script>
</body>
</html>
